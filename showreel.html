<script>
// ---- 00-core.js ----
// ===== Core: timing, easing, colour, drawing helpers =====
// Everything is a pure function of t. No state survives between frames.
const W = 1920, H = 1080;
const BPM = 100, BEAT = 60 / BPM, BAR = BEAT * 4;
const DUR = BAR * 33.5;            // 80.4 s: 33 full bars + final half bar
const B = n => n * BEAT;           // beat index -> seconds

const C = {
  deep: '#003830', teal: '#005147', night: '#020E0D', leaf: '#52B13C',
  green: '#00B140', neon: '#54F35D', mist: '#F0F5F0', stone: '#E5DFDC',
  ink: '#1E1E1E', red: '#E5484D', orange: '#F08A24', purple: '#8E6CEF',
  white: '#FFFFFF', dim: '#6E8F88', line: '#2B5F56', fog: '#9DB5AE'
};

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, t0, d) => clamp((t - t0) / d);
const eOut = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const eIn = x => { x = clamp(x); return x === 0 ? 0 : Math.pow(2, 10 * x - 10); };
const eInOut = x => {
  x = clamp(x); if (x === 0 || x === 1) return x;
  return x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
};
// Damped spring step response written as a function of time (zeta < 1 -> ~1.5% overshoot, never bouncy)
function spr(t, t0, w = 17, z = 0.8) {
  const s = t - t0; if (s <= 0) return 0;
  const k = Math.sqrt(1 - z * z), wd = w * k;
  return 1 - Math.exp(-z * w * s) * (Math.cos(wd * s) + (z / k) * Math.sin(wd * s));
}
// spring that goes 0 -> 1 at tIn and 1 -> 0 at tOut (exit is an exponential accelerate-away)
const inOut = (t, tIn, tOut, w, z) => spr(t, tIn, w, z) * (1 - eIn(P(t, tOut, 0.32)));

function hex(c) {
  if (c[0] === 'r') return c.slice(c.indexOf('(') + 1, -1).split(',').map(Number);
  const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
function mixC(a, b, p) {
  const A = hex(a), Bc = hex(b); p = clamp(p);
  return `rgb(${A.map((v, i) => Math.round(v + (Bc[i] - v) * p)).join(',')})`;
}

// ---- drawing ----
function bg(ctx, c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function rr(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
}
function poly(ctx, pts) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
}
function circ(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }

const fnt = (size, w = 700) => `${w} ${size}px Geist`;
function setT(ctx, o) {
  ctx.font = fnt(o.size || 64, o.w || 700);
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.fillStyle = o.c || C.mist;
}
function T(ctx, s, x, y, o = {}) { setT(ctx, o); ctx.fillText(s, x, y); }
function TW(ctx, s, o = {}) { setT(ctx, o); ctx.textAlign = 'left'; return ctx.measureText(s).width; }

// A line that rises out of its own baseline mask at tIn and leaves upward through it at tOut.
function rise(ctx, t, s, x, y, o, tIn, tOut = 1e9, d = 0.42) {
  const pi = eOut(P(t, tIn, d)), po = eIn(P(t, tOut, 0.3));
  if (pi <= 0 || po >= 1) return;
  const size = o.size || 64, w = TW(ctx, s, o);
  const al = o.align || 'left';
  const L = al === 'center' ? x - w / 2 : al === 'right' ? x - w : x;
  ctx.save();
  ctx.beginPath(); ctx.rect(L - 30, y - size * 1.02, w + 60, size * 1.32); ctx.clip();
  T(ctx, s, x, y + (1 - pi) * size * 1.25 - po * size * 1.3, o);
  ctx.restore();
}
// Words that rise one after another; words: [[text, colour]], times: per-word start
function riseWords(ctx, t, words, x, y, o, times, tOut = 1e9) {
  const sp = TW(ctx, ' ', o);
  const ws = words.map(w => TW(ctx, w[0], o));
  const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x;
  words.forEach((w, i) => {
    rise(ctx, t, w[0], cx, y, { ...o, align: 'left', c: w[1] || o.c }, times[i], tOut + i * 0.03);
    cx += ws[i] + sp;

}
// Slam: arrives oversized and lands with an exponential settle (motion blur comes from the shutter)
function slam(ctx, t, s, x, y, o, tIn, tOut = 1e9) {
  if (t < tIn) return;
  const p = eOut(P(t, tIn, 0.24)), po = eIn(P(t, tOut, 0.3));
  if (po >= 1) return;
  const k = lerp(2.4, 1, p) * (1 - po);
  ctx.save(); ctx.translate(x, y - (o.size || 64) * 0.35); ctx.scale(k, k);
  T(ctx, s, 0, (o.size || 64) * 0.35, { ...o, align: 'center' });
  ctx.restore();

// ---- polygons & morphing ----
function resample(pts, N) {
  const L = [0];

    const a = pts[i - 1], b = pts[i % pts.length];
    L.push(L[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]));

    const d = tot * k / N;

    const u = (d - L[j]) / seg;
    out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]);

}

  { n: 'VALUE-ADDED SERVICES', c: C.leaf, b: '#2D6B22' },

const RM = 96;
const ORB = { R: 280 };
// orientation of each band around the sphere
function bandBasis(k, t) {
  const fl = eInOut(P(t, B(78), B(1.2)));
  const tilt = lerp([0.35, 1.25, -0.6][k], 0, fl), spin = [0, 2.1, 4.2][k] + t * 0.5 * (1 - fl);
  // normal starts tilted around x then rotated around y by spin
  let n = [0, Math.cos(tilt), Math.sin(tilt)];
  const cs = Math.cos(spin), sn = Math.sin(spin);
  n = [n[0] * cs + n[2] * sn, n[1], -n[0] * sn + n[2] * cs];
  n = [lerp(n[0], 0, fl), lerp(n[1], 0, fl), lerp(n[2], -1, fl)];
  const m = Math.hypot(...n) || 1; n = n.map(v => v / m);
  let u = Math.abs(n[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  const d = u[0] * n[0] + u[1] * n[1] + u[2] * n[2];
  u = u.map((v, i) => v - d * n[i]); const um = Math.hypot(...u); u = u.map(v => v / um);
  const v = [n[1] * u[2] - n[2] * u[1], n[2] * u[0] - n[0] * u[2], n[0] * u[1] - n[1] * u[0]];
  return { n, u, v };
}

// ---- 90-main.js ----
// ===== Frame entry point =====
// window.seek(t) renders the frame at time t. Inside one frame it averages a few
// sub-samples across a short shutter, so anything moving fast blurs along its own
// direction in proportion to its speed; still elements stay sharp.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
const tctx = tmp.getContext('2d');
window.SAMPLES = 0;          // 0 = adaptive: more sub-samples when the frame moves fast
window.SHUTTER = 1 / 180;
const sm = document.createElement('canvas'); sm.width = 240; sm.height = 135;
const smctx = sm.getContext('2d', { willReadFrequently: true });

function drawFrame(c, t) {
  t = ((t % DUR) + DUR) % DUR;      // the film loops: last frame == first frame
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  bg(c, C.night);
  for (const s of SCENES) {
    if (t >= B(s.a) && t < B(s.b)) { c.save(); s.draw(c, t); c.restore(); c.setTransform(1, 0, 0, 1, 0, 0); }
  }
}
// how much of the frame changes across the shutter (thumbnail difference)
function motionAt(t) {
  const px = [];
  for (const dt of [-0.5, 0.5]) {
    drawFrame(tctx, t + dt * window.SHUTTER);
    smctx.drawImage(tmp, 0, 0, 240, 135);
    px.push(smctx.getImageData(0, 0, 240, 135).data);
  }
  let n = 0;
  for (let i = 0; i < px[0].length; i += 4) {
    if (Math.abs(px[0][i] - px[1][i]) + Math.abs(px[0][i + 1] - px[1][i + 1]) + Math.abs(px[0][i + 2] - px[1][i + 2]) > 36) n++;
  }
  return n / (240 * 135);
}
window.samplesFor = t => {
  if (window.SAMPLES > 0) return window.SAMPLES;
  const m = motionAt(t);
  return m < 0.004 ? 2 : m < 0.03 ? 4 : m < 0.08 ? 8 : 14;
};
window.seek = function (t) {
  const K = window.samplesFor(t);
  window.lastK = K;
  if (K <= 1) { drawFrame(ctx, t); return; }
  // running average: sample k is laid over the mean of the previous k at weight 1/(k+1)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  for (let k = 0; k < K; k++) {
    drawFrame(tctx, t + ((k + 0.5) / K - 0.5) * window.SHUTTER);
    ctx.globalAlpha = 1 / (k + 1); ctx.drawImage(tmp, 0, 0);
  }
  ctx.globalAlpha = 1;
};
window.DUR = DUR; window.BEAT = BEAT;

(async () => {
  const bin = atob(window.__TTF);
  const buf = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  FONT = opentype.parse(buf.buffer);
  await Promise.all([300, 400, 500, 600, 700, 800].map(w => document.fonts.load(`${w} 100px Geist`)));
  window.seek(0);
  window.ready = true;
})();
